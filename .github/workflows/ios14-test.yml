name: iOS 14 test IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios14-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # core/doh_proxy 是 submodule（Lingyan000/fluxdo_doh），本分支没有其推送权限，
      # 因此 Rust 侧改动以 patch 形式 vendor 在本仓库 patches/ 下，checkout 后在此应用。
      # 幂等：已应用（含被子模块 pin 自然包含）则跳过；应用失败显式报错，不静默继续。
      - name: 应用已 vendor 的 Rust 网关补丁
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          applied=0
          for p in patches/*.patch; do
            if (cd core/doh_proxy && git apply --reverse --check "$GITHUB_WORKSPACE/$p" >/dev/null 2>&1); then
              echo "已有: $(basename "$p")（补丁已应用，跳过）"
              continue
            fi
            echo "应用: $(basename "$p")"
            (cd core/doh_proxy && git apply --verbose "$GITHUB_WORKSPACE/$p")
            applied=$((applied + 1))
          done
          echo "本次应用补丁数: ${applied}"
          (cd core/doh_proxy && git status --short)
      - name: 固定 Xcode 与 Flutter
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: ios14-xcode16.4
      - name: 项目准备及工具信息
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dart tool/project_prep.dart app
          { git rev-parse HEAD; git submodule status; flutter --version; dart --version; rustc --version; xcodebuild -version; } > dist/build-info.txt 2>&1
          # 本次上传的 app 版本后缀写在文件里（单一事实来源），后续步骤从文件读。
          #
          # ⚠️ 两条血泪教训（勿回退）：
          # 1) 值必须写成纯字面量。GitHub 会对 run 块整体做表达式替换，替换时会
          #    连带吞掉未被保护的花括号变量引用，带 :- 默认值的写法
          #    （APP_VERSION_SUFFIX="\${APP_VERSION_SUFFIX:-008}"）会退化成纯文本、
          #    静默取默认值——run41/42/43 后缀连续三轮卡死在 0.2.28.008 正是此因。
          # 2) 不要在 run 块里写 "$GITHUB_ENV" / "${GITHUB_ENV}"。同样是表达式替换，
          #    花括号引用会被吃成空串，于是变成 `echo ... >> ""` 静默失败，且该步骤
          #    开了 set -u，后续步骤读不到变量直接 unbound variable 整个 job 挂掉
          #    （run45 的 STEP 7 failure 就是这么来的）。改走 dist/ 下的文件传递。
          APP_VERSION_SUFFIX="021"
          echo "APP_VERSION_SUFFIX=${APP_VERSION_SUFFIX}" >> dist/build-info.txt
          printf '%s\n' "$APP_VERSION_SUFFIX" > dist/app-version-suffix.txt
      - name: 格式与静态分析
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR e1bd839ef87825347c062fb588751a1a62e02372 HEAD -- '*.dart' > "$RUNNER_TEMP/changed-dart.txt"
          test -s "$RUNNER_TEMP/changed-dart.txt"
          xargs dart format --output=none --set-exit-if-changed < "$RUNNER_TEMP/changed-dart.txt"
          while IFS= read -r file; do dart analyze --fatal-infos "$file"; done < "$RUNNER_TEMP/changed-dart.txt"
          python3 scripts/ci/test_inspect_ios14_ipa.py
      - name: iOS14 兼容与 CF 回归测试
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub \
            test/services/network/adapters/platform_adapter_test.dart \
            test/services/network/adapters/apple_transport_policy_test.dart \
            test/services/network/doh_route_diagnostics_test.dart \
            test/services/network/adapters/gateway_request_test.dart \
            test/services/network/gateway_system_proxy_source_test.dart \
            test/services/network/webview_exit_probe_test.dart \
            test/services/network/doh_egress_verification_test.dart \
            test/services/screen_track_timing_test.dart \
            test/services/diagnostics/ios14_diagnostics_test.dart \
            test/pages/ios14_diagnostics_page_test.dart \
            test/services/cf_challenge_guards_test.dart \
            test/services/cf_clearance_authority_test.dart \
            test/services/cf_disable_auto_verify_test.dart \
            test/services/cf_failure_count_round_test.dart
      - name: 构建未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          dart tool/flutterw.dart build ios --release --no-codesign --build-number="$(date -u +%Y%m%d%H)"
          nm -gU build/ios/iphoneos/Runner.app/Runner > "$RUNNER_TEMP/runner-symbols.txt"
          grep '_doh_proxy_start_with_config_json' "$RUNNER_TEMP/runner-symbols.txt"
          mkdir -p "$RUNNER_TEMP/ios14-package/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ios14-package/Payload/"

          # 让设备上「设置 → 通用 → 关于本机」显示的小版本号带 .002 后缀，
          # 便于区分每次安装（老板要求 app 版本 = 0.2.28.002）。
          # Flutter 只接受三段式 versionName（0.2.28.002 会解析失败），故
          # pubspec 保持 0.2.28，这里在打包前改写 Runner.app 内 Info.plist 的
          # CFBundleShortVersionString。CFBundleVersion（内部版本号）保持
          # 递增（--build-number 由当前时间生成），TrollStore 覆盖安装不受影响。
          #
          # 版本后缀由「项目准备及工具信息」步骤写入 dist/app-version-suffix.txt
          # （不用 $GITHUB_ENV：run 块里的花括号变量引用会被 GitHub 表达式替换
          # 吃成空串，见那里的注释；run45 STEP 7 就是这么挂的）。
          APP_VERSION_SUFFIX=$(cat dist/app-version-suffix.txt)
          APP_PLIST="$RUNNER_TEMP/ios14-package/Payload/Runner.app/Info.plist"
          BASE_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")
          NEW_VER="${BASE_VER}.${APP_VERSION_SUFFIX}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NEW_VER}" "$APP_PLIST"
          echo "app 显示版本: ${BASE_VER} -> ${NEW_VER}"
          echo "APP_VERSION_SUFFIX=${APP_VERSION_SUFFIX}"

          (cd "$RUNNER_TEMP/ios14-package" && zip -qry "$GITHUB_WORKSPACE/dist/fluxdo-ios14-test-unsigned.ipa" Payload)
          python3 scripts/ci/inspect_ios14_ipa.py dist/fluxdo-ios14-test-unsigned.ipa --output dist/ipa-inspection.json
          (cd dist && shasum -a 256 fluxdo-ios14-test-unsigned.ipa > SHA256SUMS.txt)
          cp docs/ios14-validation.md dist/
      - name: 上传已检查的测试包
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-ios14-test-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: 失败时保留非敏感静态检查结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios14-build-diagnostics-${{ github.run_number }}
          path: |
            dist/build-info.txt
            dist/ipa-inspection.json
          if-no-files-found: ignore
          retention-days: 7
      - name: 为 Release 重命名 IPA（带版本号+commit，便于本地区分）
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          # ⚠️ 本行**必须**保持「前缀 + 花括号变量 + 后缀」三段式，且该变量不能
          # 挪进任何带双花括号表达式的引号字符串里（见上方 APP_VERSION_SUFFIX 处的说明）。
          # 曾经它和 suffix 同处一个 run 块，导致两者一起被吞；如今 suffix 已改为
          # 纯字面量，这里也保持现状，避免回归。
          NEWNAME="fluxdo-ios14-test-${{ github.run_number }}-${SHORT}.ipa"
          cp "dist/fluxdo-ios14-test-unsigned.ipa" "dist/${NEWNAME}"
          rm -f "dist/fluxdo-ios14-test-unsigned.ipa"
          echo "RELEASE_IPA_NAME=${NEWNAME}" >> "$GITHUB_ENV"
          echo "重命名后: ${NEWNAME}"
      # 发布 Release（便利通道，不是构建的必要环节）。
      # 历史教训：GitHub 的 GITHUB_TOKEN 即使已授予 contents:write，
      # 创建 Release 时仍会**间歇性** 403 "Resource not accessible by
      # integration"，把构建全绿的 job 拖成 failure（run 37841469025 /
      # 37844039536）。因此这里 continue-on-error，并回退到 RELEASE_TOKEN。
      - name: 发布 GitHub Release（softprops）
        id: release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios14-test-${{ github.run_number }}
          name: iOS14 test build (ios14-test-${{ github.run_number }})
          body: |
            自动发布的 iOS14 测试包（无签名，TrollStore 安装）。
            - commit: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
            - 构建: GitHub Actions run #${{ github.run_number }}
            - 下载: ${{ env.RELEASE_IPA_NAME }}
          prerelease: true
          files: |
            dist/${{ env.RELEASE_IPA_NAME }}
            dist/SHA256SUMS.txt
            dist/build-info.txt
            dist/ios14-validation.md
            dist/ipa-inspection.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # 回退：RELEASE_TOKEN 直连 REST API（仅当上一步失败且 token 存在）。
      # 历史教训：GITHUB_TOKEN 即使授予 contents:write 也会**间歇性** 403
      # "Resource not accessible by integration"，导致构建全绿的 job 被误判失败。
      - name: 回退发布（REST API）
        if: success() && steps.release.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          REL_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REL_TAG: ios14-test-${{ github.run_number }}
          REL_SHA: ${{ github.sha }}
          REL_REF: ${{ github.ref_name }}
          REL_RUN: ${{ github.run_number }}
          REL_REPO: ${{ github.repository }}
          REL_IPA: ${{ env.RELEASE_IPA_NAME }}
        run: bash .github/scripts/publish_release.sh
